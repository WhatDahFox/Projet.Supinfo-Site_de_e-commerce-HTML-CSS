<main class="page_formulaire">
    <h1> Formulaire de contact </h1>
    <p> Une question sur nos produits ou sur l'association ?
        <br> Nous sommes à votre écoute ! </p>
    <form class="formulaire" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="44863799-b652-4396-853a-ce3096fdc847">

        <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
        <label for="prenom" class="obligatoire"> Prenom : </label>
        <input type="text" id="prenom" name="prenom" placeholder="Votre prenom" required>
        <label for="email" class="obligatoire"> E-mail : </label>
        <input type="email" id="email" name="email" placeholder="Votre e-mail" required>
        <label for="message"> Message : </label>
        <textarea id="message" name="message" placeholder="Ecrivez votre message ici ..."></textarea>
        <input type="submit" value="Envoyer">
    </form>
